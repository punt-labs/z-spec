name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Tier 1 + 4: unit tests and CLI/MCP surface parity. No external binaries, so
  # this job stays green even when an upstream tool download is unavailable.
  # Matrixed over every supported OS: the software, not just the installer,
  # must be proven on each platform this repo claims to support.
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-extras
      - run: make test-py

  # Tier 5 (partial): drives the INSTALLED wheel — the z-spec binary as a
  # subprocess and the MCP server over stdio. This is the tier that catches
  # packaging faults (a data file missing from the wheel, an entry point that
  # does not resolve), which no in-process test can see.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-extras
      - run: make install
      - run: make test-e2e

  # Tiers 2 + 3: the Z spec corpus, type-checked with fuzz and model-checked
  # with probcli, on every supported OS. Both are external binaries: fuzz
  # builds from source, probcli ships per-OS archives. A failure here is a
  # real gate failure — the specs this repo publishes are its documentation
  # of the notation.
  specs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Job-level so the cache key and the install step read one value. Must
    # equal install.sh's PROB_VERSION (a test gates the parity).
    env:
      PROB_VERSION: "1.15.1"
      # SHA-256 of each per-OS ProB archive, checked before the archive is
      # read, on cache hits and fresh downloads alike. Must equal
      # install.sh's PROB_SHA256_LINUX / PROB_SHA256_MACOS (test-gated).
      # Trust-on-first-use: the ProB host publishes no checksum or
      # signature, so each archive was fetched twice over HTTPS with
      # identical hashes. A pin proves a later download or cache entry
      # matches those bytes, not that the ProB authors produced them. A
      # value that is not 64 lowercase hex digits fails the prob-pin step
      # closed with a "no verified SHA-256 pin" error, before the cache is
      # consulted or anything is downloaded.
      PROB_SHA256_LINUX: "b0d411f71c81cfe9fdc2d898f3ef0fd7dcccc4223211cf1475b45ca46d344c24"
      PROB_SHA256_MACOS: "6e85c88eee56ec7f18f4b1737693b1dc4bfbf4f9081c42def8c09afff48f24c2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-extras

      - name: Install build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential bison flex

      # bison and flex are keg-only Homebrew formulas on macOS: installed but
      # not linked onto PATH, since the system ships older same-name versions.
      - name: Install build prerequisites (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bison flex
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      # This is the same install_fuzz() this repo ships in install.sh --
      # --fuzz-only builds it from source and lands it under $HOME/.local,
      # no sudo. Running the real function here (not a second, separate
      # build script) is the regression guard for the sudo-free installer
      # itself: a change that breaks install_fuzz() breaks this job, not
      # just the parts of the corpus gate downstream of it.
      - name: Build fuzz from source (install.sh --fuzz-only)
        run: |
          ./install.sh --fuzz-only
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The ProB archive comes from a single university host
      # (stups.hhu-hosting.de) that has dropped connections and gone fully
      # unreachable, reddening every specs leg. The DOWNLOADED ARCHIVE (not
      # the extracted tree) is cached per OS + PROB_VERSION, so once warm a
      # host outage cannot red this job and a hit makes zero requests to the
      # host. Every archive, cached or fresh, then goes through the same
      # SHA-256 pin, integrity check, slip guard, and extraction. The
      # installer job deliberately has no cache: it proves the live user
      # download path.
      #
      # This OS's archive name and pin are chosen once, here, and both the
      # cache key and the install step read these outputs, so the two can
      # never disagree about which pin is in force. The pin's full format is
      # checked here, before anything is written to GITHUB_OUTPUT, so a value
      # that can never verify an archive (a placeholder, empty, uppercase, a
      # wrong length, a second line) never reaches the cache key: no restore
      # is attempted under it and nothing is downloaded. An empty pin fails
      # first (${VAR:?}), and a pin with a newline gets its own message, since
      # it would otherwise add a line of its own to GITHUB_OUTPUT. The digits
      # are spelled out: a range like 0-9a-f follows the locale's collation.
      # The install step repeats the format check as defence in depth.
      - name: Select this OS's ProB archive and pin
        id: prob-pin
        run: |
          case "${RUNNER_OS}" in
            macOS) ARCHIVE="ProB.macos.zip";      PIN="${PROB_SHA256_MACOS:?job env PROB_SHA256_MACOS is empty}" ;;
            Linux) ARCHIVE="ProB.linux64.tar.gz"; PIN="${PROB_SHA256_LINUX:?job env PROB_SHA256_LINUX is empty}" ;;
            *)     echo "FATAL: no ProB archive for runner OS '${RUNNER_OS}'" >&2; exit 1 ;;
          esac
          case "${PIN}" in
            *$'\n'*) echo "FATAL: the ${RUNNER_OS} ProB pin spans more than one line" >&2; exit 1 ;;
          esac
          if [ "${#PIN}" -ne 64 ] || [ -n "${PIN//[0123456789abcdef]/}" ]; then
            echo "FATAL: no verified SHA-256 pin for ${ARCHIVE} (ProB ${PROB_VERSION}):" >&2
            echo "  pin is not 64 lowercase hex digits (value: ${PIN})" >&2
            echo "  no cache restored, nothing downloaded -- set the job env's PROB_SHA256_* pin" >&2
            exit 1
          fi
          printf 'archive=%s\nsha256=%s\n' "${ARCHIVE}" "${PIN}" >> "${GITHUB_OUTPUT}"

      # The pin is in the key so that changing it is an automatic miss: an
      # archive cached under the old pin is never even restored. The key is
      # bookkeeping, not the safety: what keeps a wrong archive out is the
      # install step's SHA-256 check, which every archive -- restored or
      # downloaded -- must pass before anything reads it.
      - name: Restore cached ProB archive
        id: prob-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/prob-archive
          key: prob-archive-${{ runner.os }}-${{ env.PROB_VERSION }}-${{ steps.prob-pin.outputs.sha256 }}

      # The ProB release archives carry probcli; pinned rather than "latest"
      # so a spec gate failure means the specs changed, not the tool. The
      # archive name and format differ per OS, and the layout inside is not
      # contracted, so locate the binary instead of assuming a path, and fail
      # loudly if it is absent. PROBCLI/PROB_HOME go to the env because the
      # Makefile declares `PROBCLI ?=`. Every FATAL names where the archive
      # came from -- a cache key (with the command to evict it) or the
      # download URL -- because the fix differs.
      - name: Install probcli
        env:
          ARCHIVE: ${{ steps.prob-pin.outputs.archive }}
          EXPECTED_SHA256: ${{ steps.prob-pin.outputs.sha256 }}
          CACHE_HIT: ${{ steps.prob-cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.prob-cache.outputs.cache-primary-key }}
        run: |
          mkdir -p "${RUNNER_TEMP}/ProB" "${RUNNER_TEMP}/prob-archive"
          case "${ARCHIVE}" in
            ProB.macos.zip|ProB.linux64.tar.gz) ;;
            *) echo "FATAL: unknown ProB archive name '${ARCHIVE}' from the prob-pin step" >&2; exit 1 ;;
          esac
          # The pin's format first, above the hit/miss branch, so a value
          # that can never verify an archive (a placeholder, empty, uppercase,
          # a wrong length, a second line) fails before any download on
          # either path. The prob-pin step already refuses such a pin; this
          # is defence in depth, so the step never trusts its input's shape.
          # The digits are spelled out: a range like 0-9a-f follows the
          # locale's collation and can admit other characters. Past this
          # point "SHA-256 mismatch" only ever means a real comparison of two
          # hashes failed.
          case "${EXPECTED_SHA256}" in
            *[!0123456789abcdef]*|"") PIN_FORMAT_OK=0 ;;
            *) if [ "${#EXPECTED_SHA256}" -eq 64 ]; then PIN_FORMAT_OK=1; else PIN_FORMAT_OK=0; fi ;;
          esac
          if [ "${PIN_FORMAT_OK}" != "1" ]; then
            echo "FATAL: no verified SHA-256 pin for ${ARCHIVE} (ProB ${PROB_VERSION}):" >&2
            echo "  pin is not 64 lowercase hex digits (value: ${EXPECTED_SHA256})" >&2
            echo "  nothing downloaded or read -- set the job env's PROB_SHA256_* pin" >&2
            exit 1
          fi
          ARCHIVE_PATH="${RUNNER_TEMP}/prob-archive/${ARCHIVE}"
          if [ "${CACHE_HIT}" = "true" ]; then
            SOURCE="cache key ${CACHE_KEY}"
            HINT="; evict it with: gh cache delete '${CACHE_KEY}' -R '${GITHUB_REPOSITORY}'"
            if [ ! -f "${ARCHIVE_PATH}" ]; then
              echo "FATAL: cache hit but ${ARCHIVE_PATH} is missing (${SOURCE})${HINT}" >&2
              exit 1
            fi
            echo "ProB ${PROB_VERSION} archive restored from ${SOURCE} -- no download"
          else
            PROB_URL="https://stups.hhu-hosting.de/downloads/prob/tcltk/releases/${PROB_VERSION}/${ARCHIVE}"
            SOURCE="download ${PROB_URL}"
            HINT=""
            echo "ProB archive cache miss (cache-hit='${CACHE_HIT}', key ${CACHE_KEY}) -- downloading ${PROB_URL}"
            # Same flags as install.sh's install_probcli() (see the comment
            # there; a test gates the parity): HTTPS only, transient drops
            # recover, a sustained outage fails in about 2.5 minutes.
            curl -fL --proto '=https' --proto-redir '=https' \
              --connect-timeout 20 --retry 5 --retry-connrefused \
              --retry-max-time 300 --speed-limit 1024 --speed-time 60 \
              --retry-all-errors \
              -o "${ARCHIVE_PATH}" "${PROB_URL}" || {
              echo "FATAL: ProB download failed: ${PROB_URL}" >&2
              exit 1
            }
          fi
          # SHA-256 pin, before anything reads the archive's contents. This,
          # not the slip guard, is what protects the cache layer: a cache
          # entry is never trusted more than a fresh download. The archive is
          # read from stdin, so its path never reaches shasum's argv. The
          # pipeline's status is cut's, so an unreadable archive or a failing
          # shasum shows up as an empty hash -- reported as such, never as a
          # mismatch.
          ACTUAL_SHA256="$(shasum -a 256 < "${ARCHIVE_PATH}" | cut -d' ' -f1)"
          if [ -z "${ACTUAL_SHA256}" ]; then
            echo "FATAL: could not read or hash ${ARCHIVE_PATH} (from ${SOURCE})${HINT}" >&2
            exit 1
          fi
          if [ "${ACTUAL_SHA256}" != "${EXPECTED_SHA256}" ]; then
            echo "FATAL: SHA-256 mismatch for ${ARCHIVE} (ProB ${PROB_VERSION})${HINT}" >&2
            echo "  expected: ${EXPECTED_SHA256}" >&2
            echo "  actual:   ${ACTUAL_SHA256}" >&2
            echo "  archive:  ${ARCHIVE_PATH}, from ${SOURCE}" >&2
            exit 1
          fi
          not_an_archive() {
            echo "FATAL: ${ARCHIVE} from ${SOURCE} is not a valid archive (file -b: $(file -b "${ARCHIVE_PATH}"))${HINT}" >&2
            exit 1
          }
          case "${ARCHIVE}" in
            *.zip)
              unzip -tq "${ARCHIVE_PATH}" >/dev/null || not_an_archive
              LISTING="$(unzip -Z1 "${ARCHIVE_PATH}")" || not_an_archive ;;
            *)
              LISTING="$(tar -tzf "${ARCHIVE_PATH}")" || not_an_archive ;;
          esac
          # Same zip-slip/tar-slip guard as install.sh's install_probcli():
          # an absolute path or ../ segment in the archive's own listing
          # could write outside the dest dir if the archive's publisher or
          # host is compromised. It inspects the archive's members, not the
          # cache layer -- the SHA-256 pin above covers that.
          if printf '%s\n' "${LISTING}" | grep -qE '^/|(^|/)\.\./'; then
            echo "FATAL: probcli archive from ${SOURCE} contains unsafe paths (absolute or ../)${HINT}" >&2
            exit 1
          fi
          # The archive passed the SHA-256 pin and listed cleanly, so a failed
          # extraction is the pinned archive itself or the runner's disk --
          # never a stale or tampered cache entry.
          extract_failed() {
            echo "FATAL: could not extract ${ARCHIVE} (from ${SOURCE}) into ${RUNNER_TEMP}/ProB;" >&2
            echo "  its SHA-256 matched the pin, so this is the pinned archive or the runner's disk" >&2
            exit 1
          }
          case "${ARCHIVE}" in
            *.zip) unzip -q "${ARCHIVE_PATH}" -d "${RUNNER_TEMP}/ProB" || extract_failed ;;
            *)     tar -xzf "${ARCHIVE_PATH}" -C "${RUNNER_TEMP}/ProB" || extract_failed ;;
          esac
          PROBCLI="$(find "${RUNNER_TEMP}/ProB" -type f -name probcli | head -n 1)"
          if [ -z "${PROBCLI}" ]; then
            echo "FATAL: no probcli in the ProB ${PROB_VERSION} archive from ${SOURCE}" >&2
            find "${RUNNER_TEMP}/ProB" -maxdepth 2 >&2
            exit 1
          fi
          chmod +x "${PROBCLI}"
          echo "PROBCLI=${PROBCLI}" >> "${GITHUB_ENV}"
          echo "PROB_HOME=$(dirname "${PROBCLI}")" >> "${GITHUB_ENV}"

      # Exact match, not substring, same as install.sh: 1.15.10 must not
      # pass as 1.15.1.
      - name: Verify both binaries resolve
        run: |
          FUZZ_PATH="$(command -v fuzz)" || {
            echo "FATAL: fuzz is not on PATH (${PATH}); the fuzz build step installs it to \$HOME/.local/bin" >&2
            exit 1
          }
          echo "fuzz: ${FUZZ_PATH}"
          if ! PROB_OUT="$("${PROBCLI}" -version 2>&1)"; then
            echo "FATAL: ${PROBCLI} -version failed; its output:" >&2
            printf '%s\n' "${PROB_OUT}" >&2
            exit 1
          fi
          printf '%s\n' "${PROB_OUT}"
          PROB_VER="$(printf '%s\n' "${PROB_OUT}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          if [ "${PROB_VER}" != "${PROB_VERSION}" ]; then
            echo "FATAL: expected probcli ${PROB_VERSION}, got: ${PROB_VER:-unreadable}" >&2
            exit 1
          fi

      # Save only on a miss, and only here: after the SHA-256 pin, the slip
      # guard, and the version check all passed. A mismatched, corrupt, or
      # hostile archive fails a step above and is never cached, and saving
      # before `make test` means a spec regression on this run does not
      # throw away a known-good archive. A failed save (cache service down,
      # key raced by a parallel run) is only a warning, so the job stays
      # green but the next run downloads again.
      - name: Save ProB archive to cache
        if: steps.prob-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/prob-archive
          key: ${{ steps.prob-cache.outputs.cache-primary-key }}

      # type-z-* (fuzz) then test-z-* (probcli) over every examples/*.tex.
      - run: make type
      - run: make test

  # The shipped installer, run whole, on every supported OS × every TeX
  # availability state (z-spec-58u + operator rule: installer and software
  # proven on each platform). Matrix entries run in parallel, so this adds
  # no wall time over a single platform. Each entry runs install.sh end to
  # end -- the CLI via uv tool install, probcli via its per-OS archive
  # (install_probcli's own Darwin/Linux branch), and the sudo-free fuzz
  # source build -- then verifies through the installed artifact itself:
  # doctor must report both tools, a real spec must type-check (fuzz) and
  # model-check (probcli).
  #
  # The tex dimension covers install_fuzz()'s two TEXMFHOME branches:
  # tex=absent (bare runner) proves the no-TeX path degrades gracefully
  # instead of failing the install; tex=present installs a real TeX
  # distribution first and then REQUIRES kpsewhich to find fuzz.sty
  # afterward -- the copy + mktexlsr chain, which a bare runner can never
  # exercise. --no-plugin because CI runners have no claude CLI; the plugin
  # step would auto-skip anyway, and this job's subject is the toolchain.
  #
  # No ProB archive cache here, unlike the specs job, and no local-archive
  # override in install.sh: this job exists to prove the live download a
  # user's install performs, so an outage of the ProB host reddening it is
  # an honest signal. install_probcli's own bounded curl retries absorb
  # transient drops.
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        tex: [absent, present]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential bison flex

      # bison and flex are keg-only Homebrew formulas on macOS -- installed
      # but not linked onto PATH by default, since the system ships older
      # versions at the same names. gcc, make, git, cpp, and a POSIX awk
      # all ship with Xcode's command line tools, already present on
      # GitHub's macos-latest image.
      - name: Install build prerequisites (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bison flex
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      # texlive-base carries kpsewhich and mktexlsr -- the minimal footprint
      # that makes install_fuzz()'s TEXMFHOME branch run for real.
      - name: Install TeX (Linux, tex=present)
        if: runner.os == 'Linux' && matrix.tex == 'present'
        run: sudo apt-get install -y texlive-base

      # BasicTeX is the slim MacTeX distribution; its binaries land in
      # /Library/TeX/texbin, which is not on PATH until added.
      - name: Install TeX (macOS, tex=present)
        if: runner.os == 'macOS' && matrix.tex == 'present'
        run: |
          brew install --cask basictex
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"

      # Pre-publish trees pin a VERSION that PyPI does not have yet: the
      # release tool bumps it in the release PR and the pre-tag README-pin
      # PR, and only the tag push publishes it. On those trees the pinned
      # install can never succeed, so build the wheel from the tree under
      # review and inject it via install.sh's ZSPEC_LOCAL_WHEEL seam —
      # same script, same flow, only the CLI's download source swapped.
      # The condition is the actual fact (the pinned version is absent
      # from PyPI), not a branch-name list: name-coupling already missed
      # one release-tool branch prefix and broke a release.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build local wheel when the pinned version is unpublished
        run: |
          VERSION="$(grep -m1 '^VERSION=' install.sh | cut -d'"' -f2)"
          if [ -z "${VERSION}" ]; then
            echo "FATAL: could not extract VERSION from install.sh" >&2
            exit 1
          fi
          # Branch on the HTTP status, not curl success: only a definite
          # 404 means unpublished. A network outage or 5xx must fail this
          # job loudly, never silently flip it onto the local-wheel path
          # and mask a broken PyPI fetch.
          if ! STATUS="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/punt-z-spec/${VERSION}/json")"; then
            echo "FATAL: PyPI probe could not complete (curl error above)" >&2
            exit 1
          fi
          case "${STATUS}" in
            200)
              echo "punt-z-spec ${VERSION} is on PyPI -- testing the real fetch" ;;
            404)
              echo "punt-z-spec ${VERSION} is NOT on PyPI -- building the local wheel"
              # rm first: ls dist/*.whl must resolve to exactly one path,
              # and a stale wheel from any earlier build would make it two.
              rm -rf dist
              uv build
              echo "ZSPEC_LOCAL_WHEEL=$(ls dist/*.whl)" >> "$GITHUB_ENV" ;;
            *)
              echo "FATAL: unexpected PyPI status ${STATUS} for punt-z-spec ${VERSION}" >&2
              exit 1 ;;
          esac

      - name: Run the full installer (CLI + probcli + fuzz)
        run: |
          ./install.sh --no-plugin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Verification is through the installed artifact, not the working
      # tree: doctor exits nonzero if either tool is missing or broken, and
      # the check/test pair proves fuzz and probcli each do real work on a
      # real spec -- resolving on PATH is not evidence a binary functions.
      - name: Verify via the installed artifact
        run: |
          z-spec --version
          z-spec doctor
          z-spec check examples/animation-hints-good.tex
          z-spec test examples/animation-hints-good.tex

      # With a real TeX tree present, the TEXMFHOME copy is REQUIRED to have
      # landed and been indexed -- a miss here means the copy or mktexlsr
      # chain regressed, exactly the branch a bare runner cannot see.
      - name: Verify fuzz.sty reached the TeX path (tex=present)
        if: matrix.tex == 'present'
        run: kpsewhich fuzz.sty
