name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Tier 1 + 4: unit tests and CLI/MCP surface parity. No external binaries, so
  # this job stays green even when an upstream tool download is unavailable.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-extras
      - run: make test-py

  # Tier 5 (partial): drives the INSTALLED wheel — the z-spec binary as a
  # subprocess and the MCP server over stdio. This is the tier that catches
  # packaging faults (a data file missing from the wheel, an entry point that
  # does not resolve), which no in-process test can see.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-extras
      - run: make install
      - run: make test-e2e

  # Tiers 2 + 3: the Z spec corpus, type-checked with fuzz and model-checked
  # with probcli. Both are external binaries: fuzz builds from source, probcli
  # ships as a Linux archive. A failure here is a real gate failure — the specs
  # this repo publishes are its documentation of the notation.
  specs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-extras

      # This is the same install_fuzz() this repo ships in install.sh --
      # --fuzz-only builds it from source and lands it under $HOME/.local,
      # no sudo. Running the real function here (not a second, separate
      # build script) is the regression guard for the sudo-free installer
      # itself: a change that breaks install_fuzz() breaks this job, not
      # just the parts of the corpus gate downstream of it.
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential bison flex
      - name: Build fuzz from source (install.sh --fuzz-only)
        run: |
          ./install.sh --fuzz-only
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The ProB release tarball carries probcli; pinned rather than "latest" so
      # a spec gate failure means the specs changed, not the tool. The archive
      # layout is not contracted, so locate the binary instead of assuming a
      # path, and fail loudly if it is absent. PROBCLI/PROB_HOME go to the env
      # because the Makefile declares `PROBCLI ?=`.
      - name: Install probcli
        env:
          PROB_VERSION: "1.15.1"
        run: |
          mkdir -p "${RUNNER_TEMP}/ProB"
          curl -fL -o "${RUNNER_TEMP}/prob.tar.gz" \
            "https://stups.hhu-hosting.de/downloads/prob/tcltk/releases/${PROB_VERSION}/ProB.linux64.tar.gz"
          tar -xzf "${RUNNER_TEMP}/prob.tar.gz" -C "${RUNNER_TEMP}/ProB"
          PROBCLI="$(find "${RUNNER_TEMP}/ProB" -type f -name probcli | head -n 1)"
          if [ -z "${PROBCLI}" ]; then
            echo "FATAL: no probcli in the ProB ${PROB_VERSION} archive" >&2
            find "${RUNNER_TEMP}/ProB" -maxdepth 2 >&2
            exit 1
          fi
          chmod +x "${PROBCLI}"
          echo "PROBCLI=${PROBCLI}" >> "${GITHUB_ENV}"
          echo "PROB_HOME=$(dirname "${PROBCLI}")" >> "${GITHUB_ENV}"

      - name: Verify both binaries resolve
        run: |
          command -v fuzz
          "${PROBCLI}" -version

      # type-z-* (fuzz) then test-z-* (probcli) over every examples/*.tex.
      - run: make type
      - run: make test

  # macOS coverage for the sudo-free fuzz build (z-spec-58u). Narrower than
  # the Linux specs job on purpose: probcli's own distribution here is a
  # Linux-only archive, so duplicating the full type-check/model-check
  # corpus sweep on macOS would not exercise anything install_fuzz() itself
  # doesn't already prove on Linux. This job's only job is proving the
  # same install_fuzz() -- git clone, configure --prefix, make, make
  # install, no sudo -- also works on the other platform this repo claims
  # to support. Neither this runner nor the Linux specs job's runner has a
  # TeX distribution installed, so kpsewhich is absent on both and the
  # TEXMFHOME copy step's non-fatal "no TeX distribution found" branch is
  # what actually runs here, not the copy itself -- confirmed by reading
  # this job's own log output. That branch not aborting is still a real,
  # useful assertion (install_fuzz()'s TeX-absent path degrades gracefully
  # rather than failing the build), just not the same claim as "the copy
  # was exercised."
  fuzz-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # bison and flex are keg-only Homebrew formulas on macOS -- installed
      # but not linked onto PATH by default, since the system ships older
      # versions at the same names. gcc, make, git, cpp, and a POSIX awk
      # all ship with Xcode's command line tools, already present on
      # GitHub's macos-latest image.
      - name: Install build prerequisites
        run: |
          brew install bison flex
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Build fuzz from source (install.sh --fuzz-only)
        run: |
          ./install.sh --fuzz-only
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify fuzz resolves and runs
        run: fuzz -Dv < /dev/null
