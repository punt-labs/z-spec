name: Nightly QA

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local:
    if: github.repository == 'punt-labs/z-spec' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUNT_TELEMETRY: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install test dependencies
        id: sync
        run: uv sync --frozen --all-extras
      - name: List quarantines and reject invalid or expired entries
        run: make test-quarantine
      - name: Install the main wheel, fuzz and ProB
        id: install
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        env:
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/z-spec-bin
          UV_TOOL_DIR: ${{ runner.temp }}/z-spec-tools
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential bison flex
          uv build
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          export PATH="$UV_TOOL_BIN_DIR:$HOME/.local/bin:$PATH"
          ZSPEC_LOCAL_WHEEL="${wheels[0]}" ./install.sh --no-plugin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run installed-wheel checks and larger-scope ProB exploration
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/z-spec-bin
        run: make test-nightly

  notify:
    needs: local
    if: >-
      ${{ always() && github.repository == 'punt-labs/z-spec' &&
          github.ref == 'refs/heads/main' &&
          (needs.local.result == 'failure' || needs.local.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .punt-labs/biff
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Notify the Biff team
        env:
          BIFF_RELAY_URL: ${{ vars.BIFF_RELAY_URL }}
          BIFF_RELAY_TOKEN: ${{ secrets.BIFF_RELAY_TOKEN }}
          BIFF_RELAY_TLS_HANDSHAKE_FIRST: ${{ vars.BIFF_RELAY_TLS_HANDSHAKE_FIRST }}
        run: >-
          uvx --from punt-biff==1.19.0 biff --user github-actions wall
          "Nightly QA failed on z-spec — ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          --duration 24h
