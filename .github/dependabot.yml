version: 2
updates:
  # Python (uv)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"

  # GitHub Actions. Without this, SHA-pinned actions rot silently until a
  # release fails — which is how the gh-action-pypi-publish pin went stale
  # (pkit-lr8g). Weekly polling picks up upstream fixes before they matter.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
